name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  ifc:
    name: IFC export validates in IfcOpenShell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ifcopenshell pytest pypdf
      - run: cargo run -q -p creabim-cli -- sample house.creabim.json
      - run: cargo run -q -p creabim-cli -- ifc house.creabim.json house.ifc
      - run: python tools/validate_ifc.py house.ifc
      - run: cargo run -q -p creabim-cli -- plan house.creabim.json "Ground Floor" ground-floor.svg
      - run: cargo run -q -p creabim-cli -- view house.creabim.json "Section A" section-a.svg
      - run: cargo run -q -p creabim-cli -- view house.creabim.json "South Elevation S" south-elevation.svg
      - run: cargo run -q -p creabim-cli -- pdf house.creabim.json house.pdf
      - name: PDF opens with a page per sheet
        run: python -c "import pypdf; r = pypdf.PdfReader('house.pdf', strict=True); n = len(r.pages); print(n, 'pages'); assert n == 3; assert 'Floor Plans' in r.pages[1].extract_text()"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-exports
          path: |
            house.ifc
            ground-floor.svg
            section-a.svg
            south-elevation.svg
            house.pdf

  windows-build:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p creabim-app -p creabim-cli
      - uses: actions/upload-artifact@v4
        with:
          name: creabim-windows
          path: |
            target/release/creabim-app.exe
            target/release/creabim.exe
